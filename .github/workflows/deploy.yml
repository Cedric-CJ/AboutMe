name: Deploy v2 to GH Pages and FTP

on:
  push:
    branches:
      - v2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies 📦
        run: npm ci
        working-directory: ./frontend

      - name: Build 🏗️
        run: npm run build
        working-directory: ./frontend
        env:
          NODE_ENV: production

      - name: Upload build artifact ⬆️
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: ./frontend/dist

  deploy_pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact ⬇️
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ./dist

      - name: Deploy to gh-pagesv2 🚀
        if: ${{ github.event_name != 'pull_request' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pagesv2

  ftp_spezialcode:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact ⬇️
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ./dist

      - name: Deploy to spezialcode.de via FTP 🌐
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: hosting226601.ae8b8.netcup.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: /
          local-dir: ./dist/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**

  ftp_specialcode:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact ⬇️
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: ./dist

      - name: Deploy to specialcode.de via FTP 🌐
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: hosting226601.ae8b8.netcup.net
          username: ${{ secrets.FTP_USERNAME_2 }}
          password: ${{ secrets.FTP_PASSWORD_2 }}
          protocol: ftps
          server-dir: /
          local-dir: ./dist/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**