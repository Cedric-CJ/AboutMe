name: Deploy v2 to GH Pages and FTP

on:
  push:
    branches:
      - v2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: ./httpdocs/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./httpdocs/frontend

      - name: Build for GitHub Pages
        run: npm run build -- --outDir dist-gh
        working-directory: ./httpdocs/frontend
        env:
          NODE_ENV: production
          DEPLOY_TARGET: gh-pages

      - name: Build for FTP
        run: npm run build -- --outDir dist-ftp
        working-directory: ./httpdocs/frontend
        env:
          NODE_ENV: production

      - name: Upload GH Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-gh
          path: ./httpdocs/frontend/dist-gh

      - name: Prepare FTP webroot (frontend + api + sanitized app)
        run: |
          set -eux
          mkdir -p webroot

          # Frontend build output
          rsync -a --delete ./httpdocs/frontend/dist-ftp/ ./webroot/

          # Public API scripts
          mkdir -p ./webroot/api
          rsync -a --delete ./httpdocs/api/ ./webroot/api/

          # Backend helper files (exclude secrets)
          mkdir -p ./webroot/app
          rsync -a --delete \
            --exclude 'logs/' \
            --exclude 'logs/*' \
            --exclude '.git/' \
            --exclude '.gitignore' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '*.env' \
            --exclude '*.env.*' \
            ./app/ ./webroot/app/

          cat <<'EOF' > ./webroot/app/.htaccess
# Protect backend helper directory from direct access
Options -Indexes
Require all denied
<FilesMatch "(?i)\\.(php|phar|inc|env|json|lock|ini|log|txt)$">
  Require all denied
</FilesMatch>
EOF

      - name: Upload FTP webroot artifact
        uses: actions/upload-artifact@v4
        with:
          name: webroot-dist
          path: ./webroot

  deploy_pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist-gh
          path: ./dist

      - name: Create 404.html for SPA routing on GH Pages
        run: cp ./dist/index.html ./dist/404.html

      - name: Create robots.txt (disallow all) for GH Pages
        run: |
          echo 'User-agent: *' > ./dist/robots.txt
          echo 'Disallow: /' >> ./dist/robots.txt

      - name: Deploy to gh-pagesv2
        if: ${{ github.event_name != 'pull_request' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pagesv2

  ftp_spezialcode:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download webroot artifact
        uses: actions/download-artifact@v4
        with:
          name: webroot-dist
          path: ./webroot

      - name: Deploy to spezialcode.de via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: hosting226601.ae8b8.netcup.net
          port: 21
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          timeout: 120000
          server-dir: /httpdocs/
          local-dir: ./webroot/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/*.env
            **/*.env.*
            **/logs/**

  ftp_specialcode:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download webroot artifact
        uses: actions/download-artifact@v4
        with:
          name: webroot-dist
          path: ./webroot

      - name: Deploy to specialcode.de via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: hosting226601.ae8b8.netcup.net
          port: 21
          username: ${{ secrets.FTP_USERNAME_2 }}
          password: ${{ secrets.FTP_PASSWORD_2 }}
          protocol: ftps
          timeout: 120000
          server-dir: /httpdocs/
          local-dir: ./webroot/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.*
            **/*.env
            **/*.env.*
            **/logs/**
